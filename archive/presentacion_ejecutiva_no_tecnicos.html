    let currentSlide = 0;

    function renderSlide(index) {
      const slide = slides[index];
      const container = document.getElementById("slideContent");
      
      container.className = "slide-fade";
      container.innerHTML = `
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${slide.tagColor}">
            ${slide.tag}
          </span>
        </div>
        <h2 class="text-xl sm:text-2xl font-black text-[var(--foreground)] tracking-tight mb-1">
          ${slide.title}
        </h2>
        <p class="text-xs sm:text-sm text-[var(--muted-foreground)] mb-4">
          ${slide.subtitle}
        </p>
        <div>
          ${slide.html}
        </div>
      `;

      // Counter & Progress Bar
      document.getElementById("slideCounter").textContent = `${index + 1} / ${slides.length}`;
      const progressPercent = ((index + 1) / slides.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPercent}%`;

      // Buttons
      document.getElementById("prevBtn").disabled = index === 0;
      const nextBtn = document.getElementById("nextBtn");
      if (index === slides.length - 1) {
        nextBtn.innerHTML = `Reiniciar <span>↺</span>`;
      } else {
        nextBtn.innerHTML = `Siguiente <span>→</span>`;
      }

      // Dots
      const dotsContainer = document.getElementById("dotsContainer");
      dotsContainer.innerHTML = slides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-2 rounded-full transition-all cursor-pointer ${
          i === index ? 'w-6 bg-emerald-500' : 'w-2 bg-[var(--border)] hover:bg-[var(--muted-foreground)]'
        }" title="Diapositiva ${i + 1}"></button>
      `).join("");
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
      } else {
        currentSlide = 0;
      }
      renderSlide(currentSlide);
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
    }

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        prevSlide();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
