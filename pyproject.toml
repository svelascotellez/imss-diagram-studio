[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-framework"
version = "6.6.0"
description = "Specification-Driven Development (SDD) - Enterprise Regulatory Hardened Edition"
readme = "README.md"
authors = [
  { name = "Salvador Velasco", email = "salvador.velasco@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sdd = "tools.sdd_cli:main"

[project.urls]
"Homepage" = "https://github.com/svelascotellez/ssd-projects"
"Bug Tracker" = "https://github.com/svelascotellez/ssd-projects/issues"
"Documentation" = "https://github.com/svelascotellez/ssd-projects/blob/main/DOCUMENTO_MAESTRO_PROYECTO_SDD_V66.md"
