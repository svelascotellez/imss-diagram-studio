<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMSS DIDT — Diagram Studio (v6.6)</title>
  <style>
    :root {
      --primary: #006341;
      --primary-hover: #004D32;
      --secondary: #B38E5D;
      --secondary-hover: #99784E;
      --bg: #0F172A;
      --canvas-bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #0F172A; color: #FFFFFF; }
    
    /* Topbar Institucional */
    .topbar {
      height: 54px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      border-bottom: 2px solid var(--secondary);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-badge {
      background: #FFFFFF;
      color: var(--primary);
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFFFFF;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: #D1FAE5;
      opacity: 0.85;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(255,255,255,0.15);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.25);
      font-weight: 600;
    }
    .pill-success {
      background: #064E3B;
      color: #34D399;
      border-color: #059669;
    }
    .btn-top {
      background: var(--secondary);
      color: #FFFFFF;
      border: none;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-top:hover { background: var(--secondary-hover); }
    .btn-top-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #FFFFFF;
    }
    .btn-top-outline:hover {
      background: rgba(255,255,255,0.15);
      border-color: #FFFFFF;
    }

    /* Layout Principal */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
      position: relative;
    }

    /* Barra lateral de herramientas estilo Draw.io */
    .sidebar {
      width: 232px;
      background: #F5F5F5;
      border-right: 1px solid #D4D4D4;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 10;
      color: #333333;
    }
    .search-container {
      padding: 6px 8px;
      border-bottom: 1px solid #D4D4D4;
      background: #F5F5F5;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 7px;
      color: #757575;
      font-size: 11px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      border-radius: 3px;
      padding: 4px 6px 4px 22px;
      color: #212121;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: #006341;
      box-shadow: 0 0 0 1px #006341;
    }
    .cat-section {
      border-bottom: 1px solid #E0E0E0;
    }
    .sidebar-section-header {
      font-size: 11.5px;
      color: #212121;
      padding: 5px 8px;
      font-weight: 600;
      background: #ECEFF1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid #FFFFFF;
      border-bottom: 1px solid #D0D4D9;
      transition: background 0.12s;
    }
    .sidebar-section-header:hover {
      background: #DFE2E6;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chevron-icon {
      font-size: 9px;
      color: #616161;
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .cat-section.collapsed .chevron-icon {
      transform: rotate(-90deg);
    }
    .cat-section.collapsed .stencil-grid {
      display: none !important;
    }
    .stencil-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      padding: 5px;
      background: #FFFFFF;
    }
    .stencil-card {
      width: 38px;
      height: 38px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.1s, transform 0.1s, background-color 0.1s;
      padding: 1px;
    }
    .stencil-card:hover {
      border-color: #006341;
      background: #F0FDF4;
      box-shadow: 0 1px 3px rgba(0,99,65,0.2);
      transform: scale(1.06);
      z-index: 2;
    }
    .stencil-card svg {
      max-width: 28px;
      max-height: 28px;
      display: block;
      pointer-events: none;
    }
    /* Tooltip clásico estilo Draw.io */
    .stencil-card::after {
      content: attr(data-title);
      position: absolute;
      left: 105%;
      top: 50%;
      transform: translateY(-50%);
      background: #1E293B;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      padding: 3px 6px;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
      z-index: 50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .stencil-card:hover::after {
      opacity: 1;
      visibility: visible;
    }
    .more-shapes-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 8px 6px;
      padding: 5px 8px;
      background: #ECEFF1;
      border: 1px solid #C0C0C0;
      border-radius: 3px;
      font-size: 11px;
      color: #374151;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .more-shapes-btn:hover {
      background: #DFE2E6;
      border-color: #888888;
    }

    /* Panel Central: Canvas */
    .canvas-container {
      flex: 1;
      position: relative;
      background: var(--canvas-bg);
      overflow: hidden;
    }
    #diagramCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: default;
    }

    /* Barra flotante de acciones rápidas */
    .floating-toolbar {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      border: 1px solid #334155;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 15;
    }
    .tool-btn {
      background: transparent;
      color: #E2E8F0;
      border: 1px solid transparent;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tool-btn.active {
      background: var(--primary);
      border-color: var(--secondary);
      color: #FFFFFF;
      font-weight: 600;
    }
    .tool-btn:hover:not(.active) { background: #334155; }

    /* Panel de Gobernanza e Inspector (Derecha) */
    .inspector-panel {
      width: 300px;
      background: #1E293B;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
      z-index: 10;
    }
    .gov-card {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 1rem;
    }
    .gov-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .gov-item {
      font-size: 0.75rem;
      color: #94A3B8;
      margin-bottom: 0.35rem;
      display: flex;
      justify-content: space-between;
    }
    .gov-item span.val { color: #E2E8F0; font-family: monospace; font-weight: 600; }
    .badge-pass {
      background: #064E3B;
      color: #34D399;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    /* Notificación de Alerta / Toast */
    #alertToast {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #064E3B;
      color: #FFFFFF;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #34D399;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }
    #alertToast.error {
      background: #7F1D1D;
      border-color: #F87171;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <!-- Alerta emergente -->
  <div id="alertToast" role="alert" aria-live="assertive"></div>

  <!-- Input oculto para importación de archivos -->
  <input type="file" id="importXmlInput" accept=".xml,.drawio" style="display:none;" onchange="handleImportFile(event)" />

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">IMSS</span>
      <div>
        <div class="brand-title">Diagram Studio DIDT</div>
        <div class="brand-sub">Solución Soberana de Modelado Técnico e Infraestructura (v6.6)</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-top btn-top-outline" onclick="document.getElementById('importXmlInput').click()">
        <span>📥</span> Importar Draw.io XML
      </button>
      <button class="btn-top" onclick="exportDrawioXml()">
        <span>📤</span> Exportar Draw.io XML
      </button>
      <button class="btn-top" onclick="exportSvgWithLetterhead()">
        <span>🏛️</span> SVG Membretado
      </button>
      <button class="btn-top btn-top-outline" onclick="clearCanvas()">
        Limpiar
      </button>
    </div>
  </header>

  <!-- Body -->
  <div class="app-body">
    <!-- Barra Lateral de Stencils y Figuras estilo Draw.io -->
    <aside class="sidebar" id="drawioSidebar">
      <!-- Buscador superior idéntico a Draw.io -->
      <div class="search-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="search" id="stencilSearch" class="search-input"
                 placeholder="Search Shapes"
                 autocomplete="off"
                 oninput="filterStencils(this.value)" />
        </div>
      </div>

      <div id="stencilsContainer">
        <!-- 1. GENERAL (Cuadrícula 5 columnas con 20 formas canónicas de Draw.io) -->
        <div class="cat-section" data-cat="general">
          <div class="sidebar-section-header" onclick="toggleSection(this)">
            <div class="header-left">
              <span class="chevron-icon">▼</span>
              <span>General</span>
            </div>
          </div>
          <div class="stencil-grid">
            <!-- 1. Rectangle -->
            <div class="stencil-card" data-title="Rectangle" data-tags="rectangle cuadro rectangulo box"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'rectangle', 'Rectangle', 120, 60)"
                 onclick="addShape('rectangle', 'Rectangle', 120, 60)">
              <svg viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 2. Rounded Rectangle -->
            <div class="stencil-card" data-title="Rounded Rectangle" data-tags="rounded rectangle redondeado"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'rounded', 'Rounded Rectangle', 120, 60)"
                 onclick="addShape('rounded', 'Rounded Rectangle', 120, 60)">
              <svg viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 3. Text -->
            <div class="stencil-card" data-title="Text" data-tags="text texto etiqueta label"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'text', 'Text', 80, 40)"
                 onclick="addShape('text', 'Text', 80, 40)">
              <svg viewBox="0 0 32 32"><text x="16" y="22" font-size="18" font-family="Inter, system-ui, sans-serif" font-weight="bold" fill="#333333" text-anchor="middle">A</text></svg>
            </div>
            <!-- 4. Ellipse -->
            <div class="stencil-card" data-title="Ellipse" data-tags="ellipse elipse oval ovalo"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'ellipse', 'Ellipse', 120, 70)"
                 onclick="addShape('ellipse', 'Ellipse', 120, 70)">
              <svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="13" ry="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 5. Square -->
            <div class="stencil-card" data-title="Square" data-tags="square cuadrado"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'rectangle', 'Square', 80, 80)"
                 onclick="addShape('rectangle', 'Square', 80, 80)">
              <svg viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 6. Circle -->
            <div class="stencil-card" data-title="Circle" data-tags="circle circulo"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'circle', 'Circle', 80, 80)"
                 onclick="addShape('circle', 'Circle', 80, 80)">
              <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 7. Diamond -->
            <div class="stencil-card" data-title="Diamond" data-tags="diamond rombo decision condicion"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'diamond', 'Diamond', 100, 70)"
                 onclick="addShape('diamond', 'Diamond', 100, 70)">
              <svg viewBox="0 0 32 32"><polygon points="16,3 29,16 16,29 3,16" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 8. Triangle -->
            <div class="stencil-card" data-title="Triangle" data-tags="triangle triangulo"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'triangle', 'Triangle', 90, 80)"
                 onclick="addShape('triangle', 'Triangle', 90, 80)">
              <svg viewBox="0 0 32 32"><polygon points="16,4 29,27 3,27" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 9. Cylinder -->
            <div class="stencil-card" data-title="Cylinder" data-tags="cylinder cilindro database base de datos db"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'cylinder', 'Database', 100, 80)"
                 onclick="addShape('cylinder', 'Database', 100, 80)">
              <svg viewBox="0 0 32 32">
                <path d="M 6 8 L 6 24 A 10 4 0 0 0 26 24 L 26 8 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
                <ellipse cx="16" cy="24" rx="10" ry="4" fill="none" stroke="#333333" stroke-width="1.5"/>
                <ellipse cx="16" cy="8" rx="10" ry="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
              </svg>
            </div>
            <!-- 10. Cloud -->
            <div class="stencil-card" data-title="Cloud" data-tags="cloud nube cloud storage internet"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'cloud', 'Cloud', 120, 75)"
                 onclick="addShape('cloud', 'Cloud', 120, 75)">
              <svg viewBox="0 0 32 32"><path d="M 9 22 C 4 22 4 15 9 14 C 7 8 16 6 19 11 C 23 8 28 11 27 16 C 30 17 30 22 25 22 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 11. Document -->
            <div class="stencil-card" data-title="Document" data-tags="document documento page pagina"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'document', 'Document', 110, 75)"
                 onclick="addShape('document', 'Document', 110, 75)">
              <svg viewBox="0 0 32 32"><path d="M 4 4 L 28 4 L 28 23 Q 22 18 16 23 Q 10 28 4 23 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 12. Internal Storage -->
            <div class="stencil-card" data-title="Internal Storage" data-tags="internal storage memoria interna"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'internal_storage', 'Internal Storage', 120, 70)"
                 onclick="addShape('internal_storage', 'Internal Storage', 120, 70)">
              <svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><line x1="10" y1="4" x2="10" y2="28" stroke="#333333" stroke-width="1.5"/><line x1="4" y1="10" x2="28" y2="10" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 13. Cube -->
            <div class="stencil-card" data-title="Cube" data-tags="cube cubo 3d isometrico"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'cube', 'Cube', 90, 85)"
                 onclick="addShape('cube', 'Cube', 90, 85)">
              <svg viewBox="0 0 32 32">
                <polygon points="5,9 23,9 23,27 5,27" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
                <polygon points="9,5 27,5 27,23 23,23 23,9 9,9" fill="#F8FAFC" stroke="#333333" stroke-width="1.2"/>
                <line x1="5" y1="9" x2="9" y2="5" stroke="#333333" stroke-width="1.2"/>
                <line x1="23" y1="9" x2="27" y2="5" stroke="#333333" stroke-width="1.2"/>
                <line x1="23" y1="27" x2="27" y2="23" stroke="#333333" stroke-width="1.2"/>
              </svg>
            </div>
            <!-- 14. Step -->
            <div class="stencil-card" data-title="Step" data-tags="step paso flecha etapa"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'step', 'Step', 120, 60)"
                 onclick="addShape('step', 'Step', 120, 60)">
              <svg viewBox="0 0 32 32"><polygon points="4,5 22,5 28,16 22,27 4,27 10,16" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 15. Tape -->
            <div class="stencil-card" data-title="Tape" data-tags="tape cinta data papel"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'tape', 'Tape', 110, 65)"
                 onclick="addShape('tape', 'Tape', 110, 65)">
              <svg viewBox="0 0 32 32"><path d="M 4 8 Q 10 4 16 8 T 28 8 L 28 24 Q 22 20 16 24 T 4 24 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 16. Note -->
            <div class="stencil-card" data-title="Note" data-tags="note nota sticky postit memo"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'note', 'Note', 100, 80)"
                 onclick="addShape('note', 'Note', 100, 80)">
              <svg viewBox="0 0 32 32"><path d="M 5 4 L 21 4 L 27 10 L 27 28 L 5 28 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><polyline points="21,4 21,10 27,10" fill="none" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 17. Card -->
            <div class="stencil-card" data-title="Card" data-tags="card tarjeta ficha"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'card', 'Card', 110, 65)"
                 onclick="addShape('card', 'Card', 110, 65)">
              <svg viewBox="0 0 32 32"><polygon points="10,4 28,4 28,28 4,28 4,10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/></svg>
            </div>
            <!-- 18. Actor -->
            <div class="stencil-card" data-title="Actor" data-tags="actor usuario user persona humana"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'actor', 'Actor', 70, 90)"
                 onclick="addShape('actor', 'Actor', 70, 90)">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="8" r="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
                <line x1="16" y1="12" x2="16" y2="22" stroke="#333333" stroke-width="1.5"/>
                <line x1="7" y1="16" x2="25" y2="16" stroke="#333333" stroke-width="1.5"/>
                <line x1="16" y1="22" x2="9" y2="29" stroke="#333333" stroke-width="1.5"/>
                <line x1="16" y1="22" x2="23" y2="29" stroke="#333333" stroke-width="1.5"/>
              </svg>
            </div>
            <!-- 19. Callout -->
            <div class="stencil-card" data-title="Callout" data-tags="callout globo bocadillo speech bubble dialogo"
                 draggable="true" ondragstart="handleShapeDragStart(event, 'callout', 'Callout', 120, 70)"
                 onclick="addShape('callout', 'Callout', 120, 70)">
              <svg viewBox="0 0 32 32"><path d="M 5 5 L 27 5 Q 29 5 29 7 L 29 20 Q 29 22 27 22 L 18 22 L 11 28 L 13 22 L 5 22 Q 3 22 3 20 L 3 7 Q 3 5 5 5 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.3"/></svg>
            </div>
            <!-- 20. Hexagon -->
            <div class="stencil-card" data-title="Hexagon" data-tags="hexagon hexagono 6 lados"

                 onclick="addShape('hexagon', 'Hexagon', 110, 70)">

  <script>
    // Estado del Canvas
    const shapes = [];
    const connectors = [];
    let currentMode = 'select'; // 'select' | 'connect'
    let selectedShape = null;
    let selectedConnector = null;
    let connectingSource = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    const svg = document.getElementById('diagramCanvas');
    const shapesLayer = document.getElementById('shapesLayer');
    const connectorsLayer = document.getElementById('connectorsLayer');
    const tempConnectorLayer = document.getElementById('tempConnectorLayer');

    // Notificaciones Toast
    function showToast(message, isError = false) {
      const toast = document.getElementById('alertToast');
      toast.textContent = message;
      toast.className = isError ? 'error' : '';
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    // Colapso/Expansión de secciones estilo Draw.io
    function toggleSection(headerEl) {
      const section = headerEl.closest('.cat-section');
      if (section) {
        section.classList.toggle('collapsed');
      }
    }

    // Filtro Reactivo de Stencils estilo Draw.io (< 50 ms)
    function filterStencils(query) {
      const q = query.toLowerCase().trim();
      const cards = document.querySelectorAll('.stencil-card');
      const sections = document.querySelectorAll('.cat-section');

      cards.forEach(card => {
        const title = (card.getAttribute('data-title') || '').toLowerCase();
        const tags = (card.getAttribute('data-tags') || '').toLowerCase();
        const match = !q || title.includes(q) || tags.includes(q);
        card.style.display = match ? 'flex' : 'none';
      });

      sections.forEach(sec => {
        const visibleCards = sec.querySelectorAll('.stencil-card[style*="display: flex"]');
        const count = q ? visibleCards.length : sec.querySelectorAll('.stencil-card').length;
        sec.style.display = count === 0 ? 'none' : 'block';
        if (q && count > 0) {
          sec.classList.remove('collapsed');
        }
      });
    }

    // Drag and Drop estilo Draw.io
    function handleShapeDragStart(e, type, label, w, h) {
      e.dataTransfer.setData('text/plain', JSON.stringify({ type, label, w, h }));
      e.dataTransfer.effectAllowed = 'copy';
    }

    function handleCanvasDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }

    function handleCanvasDrop(e) {
      e.preventDefault();
      try {
        const raw = e.dataTransfer.getData('text/plain');
        if (!raw) return;
        const data = JSON.parse(raw);
        const rect = svg.getBoundingClientRect();
        const x = e.clientX - rect.left - (data.w / 2);
        const y = e.clientY - rect.top - (data.h / 2);
        addShape(data.type, data.label, data.w, data.h, Math.max(10, x), Math.max(10, y));
      } catch (err) {
        console.error('Canvas drop error:', err);
      }
    }

    function openMoreShapesModal() {
      showToast('Bibliotecas activas: General, Misc, Advanced, Flowchart, IMSS DIDT. Todas disponibles en el panel.');
    }

    // Renderizador Geométrico Vectorial para todas las formas Draw.io e IMSS
    function renderShapeGeometry(s, strokeColor, strokeW) {
      const w = s.w;
      const h = s.h;
      const fill = s.fill || '#FFFFFF';

      switch (s.type) {
        case 'rounded':
          return `<rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'text':
          return `<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="none" />`;
        case 'ellipse':
        case 'circle':
          return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'diamond':
          return `<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'triangle':
          return `<polygon points="${w/2},0 ${w},${h} 0,${h}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'cylinder': {
          const ch = Math.min(18, h * 0.25);
          return `
            <path d="M 0 ${ch} L 0 ${h - ch} A ${w/2} ${ch} 0 0 0 ${w} ${h - ch} L ${w} ${ch} Z" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <ellipse cx="${w/2}" cy="${h - ch}" rx="${w/2}" ry="${ch}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <ellipse cx="${w/2}" cy="${ch}" rx="${w/2}" ry="${ch}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
          `;
        }
        case 'cloud':
          return `<path d="M ${w*0.25} ${h*0.75} C ${w*0.05} ${h*0.75} ${w*0.05} ${h*0.45} ${w*0.2} ${h*0.4} C ${w*0.15} ${h*0.15} ${w*0.45} ${h*0.1} ${w*0.55} ${h*0.25} C ${w*0.7} ${h*0.15} ${w*0.9} ${h*0.25} ${w*0.85} ${h*0.45} C ${w*0.98} ${h*0.5} ${w*0.98} ${h*0.75} ${w*0.8} ${h*0.75} Z" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'document':
          return `<path d="M 0 0 L ${w} 0 L ${w} ${h - 14} Q ${w*0.75} ${h - 24} ${w*0.5} ${h - 14} T 0 ${h - 14} Z" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />`;
        case 'internal_storage': {
          const sx = Math.min(22, w * 0.2);
          const sy = Math.min(20, h * 0.25);
          return `
            <rect x="0" y="0" width="${w}" height="${h}" rx="0" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <line x1="${sx}" y1="0" x2="${sx}" y2="${h}" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <line x1="0" y1="${sy}" x2="${w}" y2="${sy}" stroke="${strokeColor}" stroke-width="${strokeW}" />
          `;
        }
        case 'cube': {
          const d = Math.min(18, w * 0.2, h * 0.2);
          return `
            <polygon points="${d},${d} ${w},${d} ${w},${h} ${d},${h}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <polygon points="0,0 ${w - d},0 ${w},${d} ${d},${d}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
            <polygon points="${w - d},0 ${w},0 ${w},${h - d} ${w - d},${h - d}" fill="${fill}" stroke="${strokeColor}" stroke-width="${strokeW}" />
          `;
        }
        case 'step': {

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnSelect').classList.toggle('active', mode === 'select');
      document.getElementById('btnConnect').classList.toggle('active', mode === 'connect');
      connectingSource = null;
      tempConnectorLayer.innerHTML = '';
    }

    function addShape(type, label, w = 150, h = 65, x, y) {
      const rect = svg.getBoundingClientRect();
      const posX = x !== undefined ? x : Math.max(50, (rect.width / 2 - w / 2) + (Math.random() * 80 - 40));
      const posY = y !== undefined ? y : Math.max(50, (rect.height / 2 - h / 2) + (Math.random() * 80 - 40));

      const shape = {
        id: 'shape-' + Math.random().toString(36).substring(2, 9),
        type,
        label,
        x: posX,
        y: posY,
        w: Math.max(w, 20),
        h: Math.max(h, 20),
        stroke: '#006341',
        fill: '#FFFFFF',
        strokeWidth: 2
      };

      shapes.push(shape);
      selectShape(shape);
      render();
      return shape;
    }

    function addConnector(sourceId, sourcePort, targetId, targetPort, label = '') {
      if (sourceId === targetId) return null; // Anti-auto-bucles
      const exists = connectors.some(c => c.sourceId === sourceId && c.targetId === targetId);
      if (exists) return null;

      const conn = {
        id: 'conn-' + Math.random().toString(36).substring(2, 9),
        sourceId,
        sourcePort: sourcePort || 'east',
        targetId,
        targetPort: targetPort || 'west',
        stroke: '#006341',
        strokeWidth: 2,
        label
      };

      connectors.push(conn);
      selectConnector(conn);
      render();
      return conn;
    }

    function getPortCoords(shape, port) {
      const { x, y, w, h } = shape;
      switch (port) {
        case 'north': return { x: x + w / 2, y: y };
        case 'south': return { x: x + w / 2, y: y + h };
        case 'east': return { x: x + w, y: y + h / 2 };
        case 'west': return { x: x, y: y + h / 2 };
        default: return { x: x + w / 2, y: y + h / 2 };
      }
    }

    function computeOrthogonalPath(p1, port1, p2, port2) {
      const pts = [p1];
      if (port1 === 'east' && port2 === 'west') {
        const midX = (p1.x + p2.x) / 2;
        pts.push({ x: midX, y: p1.y });
        pts.push({ x: midX, y: p2.y });
      } else if (port1 === 'south' && port2 === 'north') {
        const midY = (p1.y + p2.y) / 2;
        pts.push({ x: p1.x, y: midY });
        pts.push({ x: p2.x, y: midY });
      } else {
        const midX = (p1.x + p2.x) / 2;
        pts.push({ x: midX, y: p1.y });
        pts.push({ x: midX, y: p2.y });
      }
      pts.push(p2);

      return pts.reduce((acc, pt, i) => (i === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`), '');
    }

    function render() {
      // 1. Render Connectors
      connectorsLayer.innerHTML = '';
      connectors.forEach(c => {
        const s1 = shapes.find(s => s.id === c.sourceId);
        const s2 = shapes.find(s => s.id === c.targetId);
        if (!s1 || !s2) return;

        const p1 = getPortCoords(s1, c.sourcePort);
        const p2 = getPortCoords(s2, c.targetPort);
        const d = computeOrthogonalPath(p1, c.sourcePort, p2, c.targetPort);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const isSelected = selectedConnector && selectedConnector.id === c.id;

        g.innerHTML = `
          <path d="${d}" fill="none" stroke="${isSelected ? '#B38E5D' : c.stroke}"
                stroke-width="${isSelected ? 3.5 : c.strokeWidth}" marker-end="url(#arrow)"
                style="cursor:pointer;" />
          ${c.label ? `<text x="${(p1.x + p2.x)/2}" y="${(p1.y + p2.y)/2 - 8}" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle" font-family="Inter, sans-serif">${c.label}</text>` : ''}
        `;

        g.onclick = (e) => {
          e.stopPropagation();
          selectConnector(c);
        };

        connectorsLayer.appendChild(g);
      });

      // 2. Render Shapes
      shapesLayer.innerHTML = '';
      shapes.forEach(s => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${s.x}, ${s.y})`);
        g.style.cursor = currentMode === 'connect' ? 'crosshair' : 'move';

        const isSelected = selectedShape && selectedShape.id === s.id;
        const strokeColor = isSelected ? '#B38E5D' : s.stroke;
        const strokeW = isSelected ? 3 : s.strokeWidth;

        const shapeSvg = renderShapeGeometry(s, strokeColor, strokeW);

        const ports = [
          { p: 'north', cx: s.w / 2, cy: 0 },
          { p: 'south', cx: s.w / 2, cy: s.h },
          { p: 'east', cx: s.w, cy: s.h / 2 },
          { p: 'west', cx: 0, cy: s.h / 2 }
        ];

        let portsSvg = '';
        ports.forEach(pt => {
          portsSvg += `
            <circle class="port" cx="${pt.cx}" cy="${pt.cy}" r="4.5"
                    fill="#B38E5D" stroke="#FFFFFF" stroke-width="1.5"
                    style="cursor:pointer;" data-port="${pt.p}" />
          `;
        });

        g.innerHTML = `
          ${shapeSvg}
          <text x="${s.w / 2}" y="${s.h / 2}" dominant-baseline="middle" text-anchor="middle"
                fill="#0F172A" font-size="12" font-weight="600" font-family="Inter, sans-serif"
                style="pointer-events:none;">${s.label}</text>
          <g class="ports" opacity="${isSelected || currentMode === 'connect' ? '1' : '0.4'}">
            ${portsSvg}
          </g>
        `;

        // Interacción con Puertos para conectar
        g.querySelectorAll('.port').forEach(circle => {
          circle.onmousedown = (e) => {
            e.stopPropagation();
            const port = circle.getAttribute('data-port');
            if (!connectingSource) {
              startConnecting(s.id, port);
            }
          };
          circle.onmouseup = (e) => {
            e.stopPropagation();
            const port = circle.getAttribute('data-port');
            if (connectingSource && connectingSource.shapeId !== s.id) {
              finishConnecting(s.id, port);
            }
          };
        });

        // Arrastre y Selección
        g.onmousedown = (e) => {
          if (e.target.classList.contains('port')) return;
          e.stopPropagation();
          selectShape(s);
          if (currentMode === 'select') {
            isDragging = true;
            const rect = svg.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left - s.x;
            dragOffset.y = e.clientY - rect.top - s.y;
          }
        };

        shapesLayer.appendChild(g);
      });
    }

    function selectShape(s) {
      selectedShape = s;
      selectedConnector = null;
      updateInspector();
      render();
    }

    function selectConnector(c) {
      selectedConnector = c;
      selectedShape = null;
      updateInspector();
      render();
    }

    function startConnecting(shapeId, port) {
      connectingSource = { shapeId, port };
    }

    function finishConnecting(targetId, targetPort) {
      if (connectingSource) {
        addConnector(connectingSource.shapeId, connectingSource.port, targetId, targetPort, 'Flujo DIDT');
        connectingSource = null;
        tempConnectorLayer.innerHTML = '';
      }
    }

    svg.onmousemove = (e) => {
      const rect = svg.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isDragging && selectedShape) {
        selectedShape.x = Math.max(0, mouseX - dragOffset.x);
        selectedShape.y = Math.max(0, mouseY - dragOffset.y);
        render();
      } else if (connectingSource) {
        const s1 = shapes.find(s => s.id === connectingSource.shapeId);
        if (s1) {
          const p1 = getPortCoords(s1, connectingSource.port);
          tempConnectorLayer.innerHTML = `
            <line x1="${p1.x}" y1="${p1.y}" x2="${mouseX}" y2="${mouseY}"
                  stroke="#B38E5D" stroke-width="2" stroke-dasharray="4 4"/>
          `;
        }
      }
    };

    svg.onmouseup = () => {
      isDragging = false;
      if (connectingSource) {
        connectingSource = null;
        tempConnectorLayer.innerHTML = '';
      }
    };

    svg.onclick = () => {
      selectedShape = null;
      selectedConnector = null;
      updateInspector();
      render();
    };

    window.onkeydown = (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedShape) {
          const targetId = selectedShape.id;
          const idx = shapes.findIndex(s => s.id === targetId);
          if (idx !== -1) shapes.splice(idx, 1);
          for (let i = connectors.length - 1; i >= 0; i--) {
            if (connectors[i].sourceId === targetId || connectors[i].targetId === targetId) {
              connectors.splice(i, 1);
            }
          }
          selectedShape = null;
          updateInspector();
          render();
        } else if (selectedConnector) {
          const idx = connectors.indexOf(selectedConnector);
          if (idx !== -1) connectors.splice(idx, 1);
          selectedConnector = null;
          updateInspector();
          render();
        }
      }
    };

    function updateInspector() {
      const div = document.getElementById('selectionProps');
      if (!div) return;
      if (selectedShape) {
        div.innerHTML = `
          <div class="gov-item"><span>ID</span><span class="val">${selectedShape.id.substring(0, 10)}</span></div>
          <div class="gov-item"><span>Etiqueta</span><span class="val">${selectedShape.label}</span></div>
          <div class="gov-item"><span>Tipo</span><span class="val">${selectedShape.type}</span></div>
          <div class="gov-item"><span>X, Y</span><span class="val">${Math.round(selectedShape.x)}, ${Math.round(selectedShape.y)}</span></div>
          <div class="gov-item"><span>Dimensiones</span><span class="val">${selectedShape.w} x ${selectedShape.h}</span></div>
        `;
      } else if (selectedConnector) {
        div.innerHTML = `
          <div class="gov-item"><span>ID Conector</span><span class="val">${selectedConnector.id.substring(0, 10)}</span></div>
          <div class="gov-item"><span>Origen</span><span class="val">${selectedConnector.sourcePort}</span></div>
          <div class="gov-item"><span>Destino</span><span class="val">${selectedConnector.targetPort}</span></div>
          <div class="gov-item"><span>Enrutamiento</span><span class="val">Ortogonal (90°)</span></div>
        `;
      } else {
        div.innerHTML = `Selecciona una forma o conector para inspeccionar atributos.`;
      }
    }

    function addSampleArchitecture() {
      shapes.length = 0;
      connectors.length = 0;

      addShape('imss_gateway', 'API Gateway DIDT', 160, 70, 80, 160);
      addShape('imss_sso', 'OAuth2 SSO IMSS', 150, 65, 320, 70);
      addShape('rectangle', 'Expediente Clínico API', 170, 70, 320, 240);
      addShape('imss_oic', 'Regla Triage IMSS', 140, 70, 580, 240);
      addShape('imss_postgres', 'PostgreSQL IMSS', 160, 70, 800, 240);

      addConnector(shapes[0].id, 'east', shapes[1].id, 'west', 'Token Verify');
      addConnector(shapes[0].id, 'east', shapes[2].id, 'west', 'REST / JSON');
      addConnector(shapes[2].id, 'east', shapes[3].id, 'west', 'Evaluar');
      addConnector(shapes[3].id, 'east', shapes[4].id, 'west', 'Persistir');

      selectedShape = null;
      render();
    }

    function clearCanvas() {
      shapes.length = 0;
      connectors.length = 0;
      selectedShape = null;
      selectedConnector = null;
      updateInspector();
      render();
      showToast('Lienzo limpiado exitosamente.');
    }

    // FEAT-004: Serialización XML Draw.io & SVG

    function escapeXml(text) {
      return (text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    // AC-4.1: Exportar a Draw.io XML
    function exportDrawioXml() {
      if (shapes.length === 0) {
        showToast('El canvas está vacío. Agrega stencils antes de exportar.', true);
        return;
      }

      let xml = '<mxGraphModel dx="1422" dy="794" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="827" pageHeight="1169" math="0" shadow="0">\n';
      xml += '  <root>\n';
      xml += '    <mxCell id="0"/>\n';
      xml += '    <mxCell id="1" parent="0"/>\n';

      // Nodos
      shapes.forEach(s => {
        let style = 'whiteSpace=wrap;html=1;';
        if (s.type === 'ellipse' || s.type === 'circle') style += 'ellipse;';
        else if (s.type === 'diamond' || s.type === 'imss_oic') style += 'rhombus;';
        else if (s.type === 'triangle') style += 'triangle;';
        else if (s.type === 'cylinder' || s.type === 'imss_postgres' || s.type === 'bpmn_data') style += 'shape=cylinder3;boundedLbl=1;backgroundOutline=1;size=15;';
        else if (s.type === 'cloud') style += 'ellipse;shape=cloud;';
        else if (s.type === 'document') style += 'shape=document;';
        else if (s.type === 'internal_storage') style += 'shape=internalStorage;backgroundOutline=1;';
        else if (s.type === 'cube') style += 'shape=cube;';
        else if (s.type === 'step') style += 'shape=step;';
        else if (s.type === 'tape') style += 'shape=tape;';
        else if (s.type === 'note') style += 'shape=note;';
        else if (s.type === 'card') style += 'shape=card;';
        else if (s.type === 'actor' || s.type === 'imss_medico' || s.type === 'imss_derechohabiente') style += 'shape=umlActor;verticalLabelPosition=bottom;verticalAlign=top;';
        else if (s.type === 'callout') style += 'shape=callout;';
        else if (s.type === 'hexagon') style += 'shape=hexagon;perimeter=hexagonPerimeter2;';
        else if (s.type === 'parallelogram') style += 'shape=parallelogram;perimeter=parallelogramPerimeter;';
        else if (s.type === 'swimlane_h') style += 'swimlane;horizontal=0;';
        else if (s.type === 'swimlane_v') style += 'swimlane;horizontal=1;';
        else if (s.type === 'process') style += 'shape=process;';
        else if (s.type === 'star') style += 'shape=star;';
        else if (s.type === 'uml_class') style += 'shape=swimlane;fontStyle=1;align=center;verticalAlign=top;';
        else if (s.type === 'uml_component') style += 'shape=component;';
        else if (s.type === 'uml_package') style += 'shape=folder;';
        else if (s.type === 'uml_boundary') style += 'shape=umlFrame;';
        else if (s.type === 'bpmn_start') style += 'shape=bpmnEvent;eventType=start;';
        else if (s.type === 'bpmn_gateway') style += 'shape=rhombus;';
        else if (s.type === 'bpmn_end') style += 'shape=bpmnEvent;eventType=end;';
        else if (s.type === 'text') style += 'text;html=1;strokeColor=none;fillColor=none;';
        else if (s.type === 'rounded' || s.type === 'bpmn_task' || s.type.startsWith('imss_')) style += 'rounded=1;';
        else style += 'rounded=0;';
        style += `strokeColor=${s.stroke};fillColor=${s.fill};strokeWidth=${s.strokeWidth};`;

        xml += `    <mxCell id="${s.id}" value="${escapeXml(s.label)}" style="${style}" vertex="1" parent="1">\n`;
        xml += `      <mxGeometry x="${Math.round(s.x)}" y="${Math.round(s.y)}" width="${Math.round(s.w)}" height="${Math.round(s.h)}" as="geometry"/>\n`;
        xml += '    </mxCell>\n';
      });

      // Conectores
      connectors.forEach(c => {
        const style = `edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=${c.stroke};strokeWidth=${c.strokeWidth};endArrow=classic;`;
        xml += `    <mxCell id="${c.id}" value="${escapeXml(c.label)}" style="${style}" edge="1" parent="1" source="${c.sourceId}" target="${c.targetId}">\n`;
        xml += '      <mxGeometry relative="1" as="geometry"/>\n';
        xml += '    </mxCell>\n';
      });

      xml += '  </root>\n';
      xml += '</mxGraphModel>';

      const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama_didt_imss.drawio.xml';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Diagrama XML compatible con Draw.io exportado exitosamente.');
    }

    // AC-4.2 & AC-4.4: Importar Draw.io XML con Protección Anti-XXE
    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        try {
          // AC-4.4: OWASP Anti-XXE Check
          const lower = content.toLowerCase();
          if (lower.includes('<!doctype') || lower.includes('<!entity') || (lower.includes('system') && lower.includes('dtd'))) {
            throw new Error('Alerta de Seguridad: El archivo contiene declaraciones DOCTYPE/XXE prohibidas');
          }

          if (!content.includes('<mxGraphModel') || !content.includes('</mxGraphModel>') || !content.includes('<root>')) {
            throw new Error('Formato incompatible: No contiene un esquema mxGraphModel válido');
          }

          // Parseo seguro en memoria
          const parser = new DOMParser();
          const doc = parser.parseFromString(content, 'application/xml');
          const parseError = doc.querySelector('parsererror');
          if (parseError) {
            throw new Error('Sintaxis XML corrupta o malformada');
          }

          const cells = Array.from(doc.querySelectorAll('mxCell'));
          const newShapes = [];
          const newConnectors = [];

          cells.forEach(cell => {
            const id = cell.getAttribute('id');
            if (!id || id === '0' || id === '1') return;

            const isVertex = cell.getAttribute('vertex') === '1';
            const isEdge = cell.getAttribute('edge') === '1';
            const source = cell.getAttribute('source');
            const target = cell.getAttribute('target');
            const val = cell.getAttribute('value') || '';
            const style = cell.getAttribute('style') || '';

            if (isEdge || (source && target)) {
              if (source && target) {
                newConnectors.push({
                  id,
                  sourceId: source,
                  sourcePort: 'east',
                  targetId: target,
                  targetPort: 'west',
                  stroke: '#006341',
                  strokeWidth: 2,
                  label: val
                });
              }
            } else if (isVertex || cell.querySelector('mxGeometry')) {
              const geom = cell.querySelector('mxGeometry');
              const x = geom ? parseFloat(geom.getAttribute('x')) || 50 : 50;
              const y = geom ? parseFloat(geom.getAttribute('y')) || 50 : 50;
              const w = geom ? parseFloat(geom.getAttribute('width')) || 140 : 140;
              const h = geom ? parseFloat(geom.getAttribute('height')) || 65 : 65;

              let type = 'rectangle';
              if (style.includes('ellipse') || style.includes('circle')) type = 'ellipse';
              else if (style.includes('rhombus')) type = 'diamond';
              else if (style.includes('triangle')) type = 'triangle';
              else if (style.includes('cylinder3') || style.includes('cylinder')) type = 'cylinder';
              else if (style.includes('cloud')) type = 'cloud';
              else if (style.includes('document')) type = 'document';
              else if (style.includes('internalStorage')) type = 'internal_storage';
              else if (style.includes('cube')) type = 'cube';
              else if (style.includes('step')) type = 'step';
              else if (style.includes('tape')) type = 'tape';
              else if (style.includes('note')) type = 'note';
              else if (style.includes('card')) type = 'card';
              else if (style.includes('umlActor')) type = 'actor';
              else if (style.includes('callout')) type = 'callout';
              else if (style.includes('hexagon')) type = 'hexagon';
              else if (style.includes('parallelogram')) type = 'parallelogram';
              else if (style.includes('swimlane')) type = 'swimlane_h';
              else if (style.includes('star')) type = 'star';
              else if (style.includes('rounded=1')) type = 'rounded';

              newShapes.push({
                id,
                type,
                label: val || 'Componente Importado',
                x,
                y,
                w: Math.max(w, 20),
                h: Math.max(h, 20),
                stroke: '#006341',
                fill: '#FFFFFF',
                strokeWidth: 2
              });
            }
          });

          if (newShapes.length === 0) {
            throw new Error('No se encontraron celdas válidas para importar.');
          }

          // Actualizar canvas
          shapes.length = 0;
          connectors.length = 0;
          shapes.push(...newShapes);
          connectors.push(...newConnectors);
          selectedShape = null;
          selectedConnector = null;
          updateInspector();
          render();
          showToast(`Importación exitosa: ${newShapes.length} formas y ${newConnectors.length} conectores.`);
        } catch (err) {
          showToast(err.message, true);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    // AC-4.3: Exportación Vectorial SVG con Membrete Oficial DIDT
    function exportSvgWithLetterhead() {
      if (shapes.length === 0) {
        showToast('El canvas está vacío. Agrega stencils antes de exportar.', true);
        return;
      }

      let minX = Math.min(...shapes.map(s => s.x)) - 60;
      let minY = Math.min(...shapes.map(s => s.y)) - 100;
      let maxX = Math.max(...shapes.map(s => s.x + s.w)) + 60;
      let maxY = Math.max(...shapes.map(s => s.y + s.h)) + 100;

      const w = Math.max(1200, maxX - Math.min(0, minX));
      const h = Math.max(800, maxY - Math.min(0, minY));
      const nowIso = new Date().toISOString().split('T')[0];

      let svgDoc = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Diagrama de Arquitectura DIDT IMSS">\n`;
      svgDoc += '  <defs>\n';
      svgDoc += '    <style>\n';
      svgDoc += '      .imss-title { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }\n';
      svgDoc += '      .imss-sub { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: #E2E8F0; }\n';
      svgDoc += '      .imss-node-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; text-anchor: middle; dominant-baseline: middle; }\n';
      svgDoc += '      .imss-footer { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: #64748B; }\n';
      svgDoc += '    </style>\n';
      svgDoc += '    <marker id="arrowhead-imss" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">\n';
      svgDoc += '      <polygon points="0 0, 10 3.5, 0 7" fill="#006341" />\n';
      svgDoc += '    </marker>\n';
      svgDoc += '    <pattern id="imss-grid" width="20" height="20" patternUnits="userSpaceOnUse">\n';
      svgDoc += '      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.5" />\n';
      svgDoc += '    </pattern>\n';
      svgDoc += '  </defs>\n';

      // Fondo
      svgDoc += `  <rect width="${w}" height="${h}" fill="#F8FAFC" />\n`;
      svgDoc += `  <rect y="70" width="${w}" height="${h - 110}" fill="url(#imss-grid)" />\n`;

      // Membrete Superior Oficial
      svgDoc += `  <g id="imss-letterhead">\n`;
      svgDoc += `    <rect x="0" y="0" width="${w}" height="64" fill="#006341" />\n`;
      svgDoc += `    <rect x="0" y="64" width="${w}" height="4" fill="#B38E5D" />\n`;
      svgDoc += `    <text x="24" y="28" class="imss-title">DIRECCION DE INNOVACION Y DESARROLLO TECNOLOGICO — IMSS</text>\n`;
      svgDoc += `    <text x="24" y="48" class="imss-sub">Diagrama de Arquitectura Técnica | Emisión: ${nowIso} | Interoperabilidad: Draw.io Compatible</text>\n`;
      svgDoc += `  </g>\n`;

      // Conectores
      svgDoc += '  <g id="imss-connectors">\n';
      connectors.forEach(c => {
        const s1 = shapes.find(s => s.id === c.sourceId);
        const s2 = shapes.find(s => s.id === c.targetId);
        if (s1 && s2) {
          const p1 = getPortCoords(s1, c.sourcePort);
          const p2 = getPortCoords(s2, c.targetPort);
          const d = computeOrthogonalPath(p1, c.sourcePort, p2, c.targetPort);
          svgDoc += `    <path d="${d}" fill="none" stroke="${c.stroke}" stroke-width="${c.strokeWidth}" marker-end="url(#arrowhead-imss)" />\n`;
        }
      });
      svgDoc += '  </g>\n';

      // Formas
      svgDoc += '  <g id="imss-shapes">\n';
      shapes.forEach(s => {
        svgDoc += `    <g transform="translate(${s.x}, ${s.y})">\n`;
        svgDoc += `      ${renderShapeGeometry(s, s.stroke, s.strokeWidth)}\n`;
        svgDoc += `      <text x="${s.w / 2}" y="${s.h / 2}" class="imss-node-label">${escapeXml(s.label)}</text>\n`;
        svgDoc += `    </g>\n`;
      });
      svgDoc += '  </g>\n';

      // Pie Institucional
      svgDoc += `  <g id="imss-footer" transform="translate(0, ${h - 36})">\n`;
      svgDoc += `    <rect x="0" y="0" width="${w}" height="36" fill="#F1F5F9" />\n`;
      svgDoc += `    <rect x="0" y="0" width="${w}" height="2" fill="#CBD5E1" />\n`;
      svgDoc += `    <text x="24" y="22" class="imss-footer">INSTITUTO MEXICANO DEL SEGURO SOCIAL | GOBERNANZA SDD v6.6 REGULATORY HARDENED EDITION | CONFIDENCIAL DIDT</text>\n`;
      svgDoc += `  </g>\n`;

      svgDoc += '</svg>';

      const blob = new Blob([svgDoc], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama_didt_imss_oficial.svg';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Documento SVG con membrete institucional descargado exitosamente.');
    }

    // Inicializar arquitectura de demostración al cargar
    addSampleArchitecture();
  </script>
